<!doctype html>
<html><head><meta charset="utf-8"><title>Brainbox preview</title>
<link rel="stylesheet" href="ENGINE/style.css">
<style>
  body.preview { background:#05070A; overflow:auto; }
  body.preview #stage { position:relative; margin: 20px auto; }
  #ctl { position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; align-items:center; padding:12px 18px; background:#0B0F16; color:#cfd6e0; font:14px/1 sans-serif; z-index:9; }
  #ctl input[type=range]{ flex:1 }
  #ctl button { background:#39FF88; border:0; padding:8px 16px; border-radius:8px; font-weight:700; cursor:pointer }
</style></head>
<body>
<div id="stage"></div>
<script src="ENGINE/icons.js"></script>
<script src="ENGINE/character.js"></script>
<script src="ENGINE/engine.js"></script>
<script src="data.js"></script>
<script>
  window.__ROOT = 'ROOT/';
  BB.init(window.__DATA);
  const isRender = location.search.includes('render');
  if (!isRender) {
    document.body.classList.add('preview');
    const fit = () => document.documentElement.style.setProperty('--scale', Math.min(1, (innerHeight - 90) / 1920));
    fit(); addEventListener('resize', fit);
    const st = document.getElementById('stage'); st.style.width = 'calc(1080px * var(--scale))'; st.style.height = 'calc(1920px * var(--scale))';
    st.style.transform = 'none'; st.style.zoom = 'var(--scale)';
    st.style.width = '1080px'; st.style.height = '1920px';
    const ctl = document.createElement('div'); ctl.id = 'ctl';
    ctl.innerHTML = '<button id="pb">▶ Play</button><input id="sc" type="range" min="0" step="0.01"><span id="tm">0.00</span>';
    document.body.append(ctl);
    const audio = new Audio(window.__DATA.audio || '');
    const sc = document.getElementById('sc'), tm = document.getElementById('tm'), pb = document.getElementById('pb');
    sc.max = window.__DATA.duration;
    let playing = false;
    const draw = (t) => { renderAt(t); sc.value = t; tm.textContent = t.toFixed(2) + 's'; };
    pb.onclick = () => { playing = !playing; pb.textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) { audio.currentTime = +sc.value; audio.play().catch(()=>{}); loop(); } else audio.pause(); };
    sc.oninput = () => { audio.currentTime = +sc.value; draw(+sc.value); };
    function loop() { if (!playing) return; const t = audio.duration ? audio.currentTime : (+sc.value + 1/60); draw(t); if (t >= window.__DATA.duration) { playing = false; pb.textContent='▶ Play'; return; } requestAnimationFrame(loop); }
    draw(0);
  }
</script>
</body></html>
